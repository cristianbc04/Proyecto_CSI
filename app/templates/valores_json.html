<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSI API</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/VistasJson.css">
</head>

<body>
    <main class="page columns">

        <header class="page-header">
            <h1 class="page-title">CSI API - Destinos pcap</h1>
            <p class="page-subtitle">Cantidad y destinos del pcap</p>
        </header>

        <section>
            <h2>Total de Destinos</h2>
            <pre>
{{ total_destinos }}
            </pre>
        </section>

        <section>
            <h2>Listado de Destinos</h2>
            <pre>
{% for destino in destinos %}
{{ destino }}
{% endfor %}
            </pre>
        </section>

    </main>
</body>
</html>
